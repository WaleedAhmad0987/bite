[project]
name = "bite"
version = "0.1.0"
description = "A merge gate for AI-written code: tests from the spec alone, that must catch bugs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# AI-written tests stay exactly as the AI wrote them, since they are the evidence.
extend-exclude = ["experiment/*/tests", "demo/test_*_spec.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Bite runs pytest and the AI command by design, from arguments the user gives it.
"bite.py" = ["S603"]
"experiment/*.py" = ["S603"]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
